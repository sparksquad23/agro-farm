<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section-Based Sensor Simulation - Agriculture Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-start:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: #6b7280;
            color: white;
        }

        .btn-clear:hover {
            background: #4b5563;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #1e3c72;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }

        .section-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
        }

        .section-id {
            font-size: 20px;
            font-weight: bold;
            color: #1e3c72;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-normal {
            background: #d1fae5;
            color: #065f46;
        }

        .status-warning {
            background: #fed7aa;
            color: #92400e;
        }

        .status-critical {
            background: #fee2e2;
            color: #991b1b;
        }

        .readings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .reading-item {
            text-align: center;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 10px;
        }

        .reading-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .reading-value {
            font-size: 24px;
            font-weight: bold;
            color: #1e3c72;
        }

        .reading-unit {
            font-size: 12px;
            color: #6b7280;
        }

        .timestamp {
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
        }

        .alert-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .log-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .log-container {
            background: #1a1a2e;
            color: #0f0;
            padding: 15px;
            border-radius: 10px;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #333;
            font-family: monospace;
        }

        .log-time {
            color: #888;
        }

        .log-data {
            color: #0f0;
        }

        .log-warning {
            color: #fbbf24;
        }

        .log-critical {
            color: #ef4444;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌾 Section-Based Sensor Monitoring System</h1>
        <p>10 Agricultural Sections with Temperature, Water Content, and Soil pH Monitoring</p>
        <div class="controls">
            <button class="btn-start" onclick="startSimulation()">▶ Start Monitoring</button>
            <button class="btn-stop" onclick="stopSimulation()">⏸ Stop Monitoring</button>
            <button class="btn-clear" onclick="clearAllData()">🗑 Clear All Data</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="totalSections">0</div>
            <div class="stat-label">Total Sections</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="activeSections">0</div>
            <div class="stat-label">Active Sections</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="warningCount">0</div>
            <div class="stat-label">Warnings</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="criticalCount">0</div>
            <div class="stat-label">Critical</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="lastUpdate">--:--:--</div>
            <div class="stat-label">Last Update</div>
        </div>
    </div>

    <div class="sections-grid" id="sectionsGrid"></div>

    <div class="log-section">
        <h3>📋 Live Monitoring Log</h3>
        <div class="log-container" id="logContainer"></div>
    </div>
</div>

<script>
    // Database configuration
    const DB_NAME = 'SectionDatabase';
    const DB_VERSION = 1;
    const STORE_NAME = 'section_readings';

    let db = null;
    let simulationInterval = null;
    let isSimulating = false;

    // Define 10 sections with their data
    const sections = [
        { id: 1, name: 'North Field A', temp_range: { min: 18, max: 32 }, water_range: { min: 40, max: 75 }, ph_range: { min: 6.0, max: 7.2 }, location: 'North Zone' },
        { id: 2, name: 'North Field B', temp_range: { min: 17, max: 31 }, water_range: { min: 45, max: 80 }, ph_range: { min: 5.8, max: 7.0 }, location: 'North Zone' },
        { id: 3, name: 'South Field A', temp_range: { min: 20, max: 35 }, water_range: { min: 35, max: 70 }, ph_range: { min: 6.2, max: 7.5 }, location: 'South Zone' },
        { id: 4, name: 'South Field B', temp_range: { min: 19, max: 34 }, water_range: { min: 38, max: 72 }, ph_range: { min: 6.1, max: 7.3 }, location: 'South Zone' },
        { id: 5, name: 'East Field A', temp_range: { min: 16, max: 30 }, water_range: { min: 50, max: 85 }, ph_range: { min: 5.5, max: 6.8 }, location: 'East Zone' },
        { id: 6, name: 'East Field B', temp_range: { min: 15, max: 29 }, water_range: { min: 48, max: 82 }, ph_range: { min: 5.6, max: 6.9 }, location: 'East Zone' },
        { id: 7, name: 'West Field A', temp_range: { min: 18, max: 33 }, water_range: { min: 42, max: 78 }, ph_range: { min: 6.3, max: 7.6 }, location: 'West Zone' },
        { id: 8, name: 'West Field B', temp_range: { min: 17, max: 32 }, water_range: { min: 44, max: 76 }, ph_range: { min: 6.4, max: 7.4 }, location: 'West Zone' },
        { id: 9, name: 'Greenhouse 1', temp_range: { min: 22, max: 28 }, water_range: { min: 60, max: 90 }, ph_range: { min: 6.5, max: 7.0 }, location: 'Greenhouse' },
        { id: 10, name: 'Greenhouse 2', temp_range: { min: 21, max: 27 }, water_range: { min: 55, max: 85 }, ph_range: { min: 6.4, max: 6.9 }, location: 'Greenhouse' }
    ];

    // Store current readings for each section
    let currentReadings = {};

    // Thresholds for determining status
    const thresholds = {
        temp: { optimal: { min: 20, max: 30 }, warning: { min: 15, max: 35 } },
        water: { optimal: { min: 50, max: 80 }, warning: { min: 30, max: 90 } },
        ph: { optimal: { min: 6.0, max: 7.0 }, warning: { min: 5.5, max: 7.5 } }
    };

    // Determine section status based on readings
    function determineStatus(temp, water, ph) {
        let issues = [];

        // Check temperature
        if (temp < thresholds.temp.warning.min || temp > thresholds.temp.warning.max) {
            return 'critical';
        }
        if (temp < thresholds.temp.optimal.min || temp > thresholds.temp.optimal.max) {
            issues.push('temp');
        }

        // Check water content
        if (water < thresholds.water.warning.min || water > thresholds.water.warning.max) {
            return 'critical';
        }
        if (water < thresholds.water.optimal.min || water > thresholds.water.optimal.max) {
            issues.push('water');
        }

        // Check pH
        if (ph < thresholds.ph.warning.min || ph > thresholds.ph.warning.max) {
            return 'critical';
        }
        if (ph < thresholds.ph.optimal.min || ph > thresholds.ph.optimal.max) {
            issues.push('ph');
        }

        return issues.length > 0 ? 'warning' : 'normal';
    }

    // Generate random value within range
    function generateRandomValue(min, max, decimals = 0) {
        let value = min + (Math.random() * (max - min));
        if (decimals === 0) {
            return Math.round(value);
        } else {
            return Math.round(value * 10) / 10;
        }
    }

    // Generate realistic sensor data for a section
    function generateSectionData(section) {
        // Generate values with some correlation and natural variation
        const temp = generateRandomValue(section.temp_range.min, section.temp_range.max, 1);
        const water = generateRandomValue(section.water_range.min, section.water_range.max, 0);
        const ph = generateRandomValue(section.ph_range.min, section.ph_range.max, 1);
        const status = determineStatus(temp, water, ph);

        return {
            section_id: section.id,
            section_name: section.name,
            temp: temp,
            water_content: water,
            soil_ph: ph,
            status: status,
            timestamp: new Date().toISOString(),
            timestamp_ms: Date.now(),
            location: section.location
        };
    }

    // Save section reading to IndexedDB
    async function saveReading(reading) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);

            const request = store.add(reading);

            request.onsuccess = () => {
                updateStats();
                addToLog(reading);
                resolve();
            };

            request.onerror = () => reject(request.error);
        });
    }

    // Update section in UI
    function updateSectionUI(sectionId, data) {
        const card = document.getElementById(`section-${sectionId}`);
        if (card) {
            // Update readings
            card.querySelector('.temp-value').textContent = data.temp;
            card.querySelector('.water-value').textContent = data.water_content;
            card.querySelector('.ph-value').textContent = data.soil_ph;

            // Update status badge
            const statusBadge = card.querySelector('.status-badge');
            statusBadge.textContent = data.status.toUpperCase();
            statusBadge.className = `status-badge status-${data.status}`;

            // Update timestamp
            card.querySelector('.timestamp').textContent = `Last: ${new Date(data.timestamp).toLocaleTimeString()}`;

            // Add alert indicator if critical
            const alertIndicator = card.querySelector('.alert-indicator');
            if (data.status === 'critical') {
                alertIndicator.style.background = '#ef4444';
                alertIndicator.style.display = 'block';
            } else if (data.status === 'warning') {
                alertIndicator.style.background = '#f59e0b';
                alertIndicator.style.display = 'block';
            } else {
                alertIndicator.style.display = 'none';
            }
        }
    }

    // Add entry to log
    function addToLog(reading) {
        const logContainer = document.getElementById('logContainer');
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';

        const time = new Date().toLocaleTimeString();
        const statusIcon = reading.status === 'normal' ? '✅' : (reading.status === 'warning' ? '⚠️' : '🔴');

        let logClass = 'log-data';
        if (reading.status === 'warning') logClass = 'log-warning';
        if (reading.status === 'critical') logClass = 'log-critical';

        const logMessage = `${statusIcon} Section ${reading.section_id} (${reading.section_name}) | Temp: ${reading.temp}°C | Water: ${reading.water_content}% | pH: ${reading.soil_ph} | Status: ${reading.status}`;

        logEntry.innerHTML = `<span class="log-time">${time}</span> <span class="${logClass}">${logMessage}</span>`;

        logContainer.insertBefore(logEntry, logContainer.firstChild);

        // Keep only last 100 logs
        while (logContainer.children.length > 100) {
            logContainer.removeChild(logContainer.lastChild);
        }
    }

    // Update statistics
    async function updateStats() {
        if (!db) return;

        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const countRequest = store.count();

        countRequest.onsuccess = () => {
            document.getElementById('totalSections').textContent = sections.length;
        };

        // Count warnings and criticals from current readings
        let warnings = 0;
        let criticals = 0;

        Object.values(currentReadings).forEach(reading => {
            if (reading.status === 'warning') warnings++;
            if (reading.status === 'critical') criticals++;
        });

        document.getElementById('warningCount').textContent = warnings;
        document.getElementById('criticalCount').textContent = criticals;
        document.getElementById('activeSections').textContent = isSimulating ? sections.length : 0;
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }

    // Render all section cards
    function renderSectionCards() {
        const grid = document.getElementById('sectionsGrid');
        grid.innerHTML = '';

        sections.forEach(section => {
            const reading = currentReadings[section.id] || {
                temp: '--',
                water_content: '--',
                soil_ph: '--',
                status: 'normal',
                timestamp: new Date()
            };

            const card = document.createElement('div');
            card.className = 'section-card';
            card.id = `section-${section.id}`;
            card.innerHTML = `
                    <div class="alert-indicator" style="display: ${reading.status === 'critical' || reading.status === 'warning' ? 'block' : 'none'}; background: ${reading.status === 'critical' ? '#ef4444' : '#f59e0b'};"></div>
                    <div class="section-header">
                        <div class="section-id">Section ${section.id}: ${section.name}</div>
                        <div class="status-badge status-${reading.status}">${reading.status.toUpperCase()}</div>
                    </div>
                    <div class="readings-grid">
                        <div class="reading-item">
                            <div class="reading-label">🌡️ Temperature</div>
                            <div class="reading-value temp-value">${reading.temp}</div>
                            <div class="reading-unit">°C</div>
                        </div>
                        <div class="reading-item">
                            <div class="reading-label">💧 Water Content</div>
                            <div class="reading-value water-value">${reading.water_content}</div>
                            <div class="reading-unit">%</div>
                        </div>
                        <div class="reading-item">
                            <div class="reading-label">🧪 Soil pH</div>
                            <div class="reading-value ph-value">${reading.soil_ph}</div>
                            <div class="reading-unit">pH</div>
                        </div>
                    </div>
                    <div style="font-size: 12px; color: #6b7280; text-align: center; margin-top: 10px;">
                        📍 ${section.location}
                    </div>
                    <div class="timestamp">Last: ${new Date(reading.timestamp).toLocaleTimeString()}</div>
                `;

            grid.appendChild(card);
        });
    }

    // Simulate sensor data generation for a specific section
    async function generateAndSaveSectionData(section) {
        const reading = generateSectionData(section);
        await saveReading(reading);

        // Update current readings
        currentReadings[section.id] = reading;

        // Update UI
        updateSectionUI(section.id, reading);

        // Trigger SMS alert if critical (for Witty integration)
        if (reading.status === 'critical') {
            triggerSMSAlert(reading);
        }
    }

    // Trigger SMS alert (simulation - will be replaced by actual GSM)
    function triggerSMSAlert(reading) {
        console.log(`🚨 SMS ALERT TRIGGERED for Section ${reading.section_id}:`, reading);
        addSystemLog(`🔔 SMS ALERT: Critical conditions in ${reading.section_name}! Temp: ${reading.temp}°C, Water: ${reading.water_content}%, pH: ${reading.soil_ph}`);
    }

    // Start simulation for all sections
    function startSimulation() {
        if (isSimulating) {
            addSystemLog('⚠️ Monitoring already running!');
            return;
        }

        isSimulating = true;
        addSystemLog('🚀 Starting section monitoring...');

        // Generate data for each section at staggered intervals (3-7 seconds)
        sections.forEach(section => {
            // Initial immediate reading
            generateAndSaveSectionData(section);

            // Set interval for periodic readings
            const interval = setInterval(() => {
                if (isSimulating) {
                    generateAndSaveSectionData(section);
                } else {
                    clearInterval(interval);
                }
            }, Math.random() * 4000 + 3000); // Random 3-7 second intervals

            // Store interval ID for cleanup
            if (!window.sectionIntervals) window.sectionIntervals = [];
            window.sectionIntervals.push(interval);
        });

        // Update overall stats
        const statsInterval = setInterval(() => {
            if (isSimulating) {
                updateStats();
            } else {
                clearInterval(statsInterval);
            }
        }, 1000);

        window.statsInterval = statsInterval;
    }

    // Stop simulation
    function stopSimulation() {
        isSimulating = false;

        // Clear all section intervals
        if (window.sectionIntervals) {
            window.sectionIntervals.forEach(interval => clearInterval(interval));
            window.sectionIntervals = [];
        }

        if (window.statsInterval) {
            clearInterval(window.statsInterval);
        }

        addSystemLog('⏹️ Section monitoring stopped');
        updateStats();
    }

    // Clear all data from database
    async function clearAllData() {
        if (!db) return;

        if (confirm('⚠️ Are you sure you want to delete ALL section data? This cannot be undone!')) {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const clearRequest = store.clear();

            clearRequest.onsuccess = () => {
                addSystemLog('🗑️ All section data cleared from database');
                updateStats();

                // Reset current readings display
                currentReadings = {};
                renderSectionCards();
            };

            clearRequest.onerror = () => {
                addSystemLog('❌ Failed to clear data');
            };
        }
    }

    // Add system message to log
    function addSystemLog(message) {
        const logContainer = document.getElementById('logContainer');
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';

        const time = new Date().toLocaleTimeString();
        logEntry.innerHTML = `<span class="log-time">${time}</span> <span style="color: #00ffff;">${message}</span>`;

        logContainer.insertBefore(logEntry, logContainer.firstChild);
    }

    // Export data to JSON (for API integration)
    async function exportData() {
        if (!db) return;

        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();

        request.onsuccess = () => {
            const data = request.result;
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `section_data_${new Date().toISOString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            addSystemLog(`📥 Exported ${data.length} readings to JSON`);
        };
    }

    // Initialize IndexedDB
    async function initDatabase() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };

            request.onupgradeneeded = (event) => {
                const db = event.target.result;

                // Create object store for section readings
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    const store = db.createObjectStore(STORE_NAME, {
                        keyPath: 'id',
                        autoIncrement: true
                    });

                    // Create indexes for efficient queries
                    store.createIndex('section_id', 'section_id', { unique: false });
                    store.createIndex('timestamp', 'timestamp', { unique: false });
                    store.createIndex('status', 'status', { unique: false });
                    store.createIndex('section_timestamp', ['section_id', 'timestamp'], { unique: false });
                }
            };
        });
    }

    // Initialize everything
    async function init() {
        await initDatabase();
        renderSectionCards();
        updateStats();
        addSystemLog('✅ Database initialized successfully');
        addSystemLog('💡 Click "Start Monitoring" to begin section data collection');
        addSystemLog('📊 Structure: Section {id, temp, water_content, soil_ph, status}');

        // Add export button to controls
        const controls = document.querySelector('.controls');
        const exportBtn = document.createElement('button');
        exportBtn.textContent = '📥 Export Data';
        exportBtn.className = 'btn-clear';
        exportBtn.onclick = exportData;
        controls.appendChild(exportBtn);
    }

    // Start the application
    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Admin - Manage Areas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f7fa;
            padding: 20px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            color: #1a3c34;
            font-size: 1.8rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary { background: #2d6a4f; color: white; }
        .btn-primary:hover { background: #1b4332; transform: translateY(-2px); }

        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }

        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }

        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }

        .btn-edit { background: #3b82f6; color: white; padding: 6px 12px; font-size: 12px; margin-right: 5px; }
        .btn-edit:hover { background: #2563eb; }

        .btn-delete { background: #ef4444; color: white; padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background: #dc2626; }

        .form-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-section h2 {
            color: #1a3c34;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2d6a4f;
        }

        .areas-list {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .areas-list h2 {
            color: #1a3c34;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }

        tr:hover {
            background: #f9fafb;
        }

        .crop-image-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .alert.success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; display: block; }
        .alert.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
        .alert.info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; display: block; }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2d6a4f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-saved { background: #d1fae5; color: #065f46; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            th, td { padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-header">
        <h1>🌾 Farm Areas Admin</h1>
        <div class="button-group">
            <button class="btn btn-secondary" id="loadBtn" onclick="loadAreas()">📂 LOAD from file</button>
            <button class="btn btn-success" id="saveBtn" onclick="saveAreas()">💾 SAVE to file</button>
            <button class="btn btn-secondary" onclick="window.open('index.html', '_blank')">🔍 View Site</button>
        </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="form-section">
        <h2 id="formTitle">➕ ADD NEW AREA</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Area Name *</label>
                <input type="text" id="areaName" placeholder="Tomato Valley">
            </div>
            <div class="form-group">
                <label>Location *</label>
                <input type="text" id="location" placeholder="North Section">
            </div>
            <div class="form-group">
                <label>Crop Name *</label>
                <input type="text" id="cropName" placeholder="Tomatoes">
            </div>
            <div class="form-group">
                <label>Image URL *</label>
                <input type="text" id="cropImage" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="form-group">
                <label>Data File (optional)</label>
                <input type="text" id="dataFile" placeholder="area1.json">
            </div>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="saveAreaToMemory()">💾 Add/Update</button>
            <button class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
        </div>
    </div>

    <div class="areas-list">
        <h2>📋 AREAS LIST <span id="areaCount"></span></h2>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Crop</th>
                    <th>Data File</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="areasTableBody">
                <tr><td colspan="7" style="text-align: center;">📂 Click "LOAD from file" to begin</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h3>⚠️ Confirm Delete</h3>
        <p>Delete <strong id="deleteAreaName"></strong>?</p>
        <p style="color: #dc2626; font-size: 13px; margin-top: 10px;">This cannot be undone!</p>
        <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn btn-danger" onclick="confirmDeleteArea()">Delete</button>
        </div>
    </div>
</div>

<script>
    let areas = [];
    let editIndex = null;
    let deleteIndex = null;

    const API_URL = '/api/areas';

    function showAlert(message, type) {
        const alertDiv = document.getElementById('alert');
        alertDiv.className = `alert ${type}`;
        alertDiv.textContent = message;
        setTimeout(() => {
            alertDiv.className = 'alert';
        }, 3000);
    }

    function renderTable() {
        const tbody = document.getElementById('areasTableBody');
        const countSpan = document.getElementById('areaCount');

        if (!areas || areas.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">📭 No areas. Add one using the form above.</td></tr>';
            countSpan.innerHTML = '(0 areas)';
            return;
        }

        countSpan.innerHTML = `(${areas.length} areas)`;

        tbody.innerHTML = areas.map((area, idx) => `
                <tr>
                    <td>${area.id}</td>
                    <td><img src="${area.cropImage}" class="crop-image-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
                    <td><strong>${escapeHtml(area.name)}</strong></td>
                    <td>${escapeHtml(area.location)}</td>
                    <td>${escapeHtml(area.crops[0])}</td>
                    <td>${area.dataFile || '-'}</td>
                    <td>
                        <button class="btn-edit" onclick="editArea(${idx})">✏️ Edit</button>
                        <button class="btn-delete" onclick="openDeleteModal(${idx}, '${escapeHtml(area.name)}')">🗑️ Delete</button>
                    </td>
                </tr>
            `).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function resetForm() {
        document.getElementById('areaName').value = '';
        document.getElementById('location').value = '';
        document.getElementById('cropName').value = '';
        document.getElementById('cropImage').value = '';
        document.getElementById('dataFile').value = '';
        document.getElementById('formTitle').innerHTML = '➕ ADD NEW AREA';
        editIndex = null;
    }

    // LOAD from file (GET request)
    async function loadAreas() {
        const loadBtn = document.getElementById('loadBtn');
        const originalText = loadBtn.innerHTML;
        loadBtn.innerHTML = '<span class="loading"></span> LOADING...';
        loadBtn.disabled = true;

        try {
            const response = await fetch(API_URL);
            const result = await response.json();

            if (result.success) {
                areas = result.data;
                renderTable();
                resetForm();
                showAlert(`✅ Loaded ${areas.length} areas from area.json`, 'success');
            } else {
                showAlert('❌ Failed to load data', 'error');
            }
        } catch (error) {
            console.error('Load error:', error);
            showAlert('❌ Error loading data. Make sure server is running.', 'error');
        } finally {
            loadBtn.innerHTML = originalText;
            loadBtn.disabled = false;
        }
    }

    // SAVE to file (POST request)
    async function saveAreas() {
        if (areas.length === 0) {
            showAlert('❌ No areas to save!', 'error');
            return;
        }

        const saveBtn = document.getElementById('saveBtn');
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="loading"></span> SAVING...';
        saveBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(areas)
            });

            const result = await response.json();

            if (result.success) {
                showAlert(`✅ ${result.message}`, 'success');
            } else {
                showAlert('❌ Failed to save', 'error');
            }
        } catch (error) {
            console.error('Save error:', error);
            showAlert('❌ Error saving data', 'error');
        } finally {
            saveBtn.innerHTML = originalText;
            saveBtn.disabled = false;
        }
    }

    // Save to memory (Add or Update)
    function saveAreaToMemory() {
        const name = document.getElementById('areaName').value.trim();
        const location = document.getElementById('location').value.trim();
        const cropName = document.getElementById('cropName').value.trim();
        const cropImage = document.getElementById('cropImage').value.trim();
        const dataFile = document.getElementById('dataFile').value.trim();

        if (!name || !location || !cropName || !cropImage) {
            showAlert('❌ Please fill all required fields (*)', 'error');
            return;
        }

        if (editIndex !== null) {
            // UPDATE
            areas[editIndex] = {
                ...areas[editIndex],
                name: name,
                location: location,
                crops: [cropName],
                cropImage: cropImage,
                dataFile: dataFile || undefined
            };
            showAlert('✅ Area UPDATED in memory', 'success');
            editIndex = null;
            document.getElementById('formTitle').innerHTML = '➕ ADD NEW AREA';
        } else {
            // ADD
            const newId = areas.length > 0 ? Math.max(...areas.map(a => a.id)) + 1 : 1;
            areas.push({
                id: newId,
                name: name,
                location: location,
                crops: [cropName],
                cropImage: cropImage,
                dataFile: dataFile || undefined
            });
            showAlert('✅ Area ADDED to memory', 'success');
        }

        renderTable();
        resetForm();
    }

    function editArea(index) {
        const area = areas[index];
        document.getElementById('areaName').value = area.name;
        document.getElementById('location').value = area.location;
        document.getElementById('cropName').value = area.crops[0];
        document.getElementById('cropImage').value = area.cropImage;
        document.getElementById('dataFile').value = area.dataFile || '';
        document.getElementById('formTitle').innerHTML = '✏️ EDIT AREA';
        editIndex = index;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openDeleteModal(index, name) {
        deleteIndex = index;
        document.getElementById('deleteAreaName').textContent = name;
        document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
        deleteIndex = null;
        document.getElementById('deleteModal').classList.remove('active');
    }

    function confirmDeleteArea() {
        if (deleteIndex !== null) {
            areas.splice(deleteIndex, 1);
            areas.forEach((area, idx) => {
                area.id = idx + 1;
            });
            renderTable();
            showAlert('✅ Area DELETED from memory', 'success');
            closeDeleteModal();

            if (editIndex === deleteIndex) {
                resetForm();
            }
        }
    }

    // Auto-load on page load
    loadAreas();
</script>
</body>
</html>
